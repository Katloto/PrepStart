<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepStart - Reset Password</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="forgot-page">

    <div class="forgot-card">

        <img src="/images/prepstart-logo.png" class="login-logo" alt="PrepStart Logo">

        <h1>Reset Your Password</h1>

        <p class="forgot-description">
            Enter a new password for your account.
        </p>

        <!-- Error message -->
        <p th:if="${error}"
           style="color: red; text-align: center; font-size: 12px; margin-bottom: 15px;"
           th:text="${error}"></p>

        <!-- If token exists, show the form. Otherwise, show a link to re-request. -->
        <form th:if="${token != null}" th:action="@{/reset-password}" method="post">

            <!-- Hidden token (from the URL) -->
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input
                            type="password"
                            id="newPassword"
                            name="password"
                            placeholder="Enter new password"
                            required
                    >
                    <button type="button" class="eye-button" id="toggleNewPassword" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none"
                                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="password-wrapper">
                    <input
                            type="password"
                            id="confirmNewPassword"
                            name="confirmPassword"
                            placeholder="Confirm new password"
                            required
                    >
                    <button type="button" class="eye-button" id="toggleConfirmPassword" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none"
                                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                Reset Password
            </button>

        </form>

        <!-- If token is missing or invalid, show this instead -->
        <p th:if="${token == null}" style="font-size: 12px; color: #555; margin-top: 15px;">
            <a href="/forgot-password" style="color: #1267e8; font-weight: 600; text-decoration: none;">
                Request a new reset link
            </a>
        </p>

        <p class="forgot-back">
            <a href="/login">Back to Log in</a>
        </p>

    </div>

</div>

<script>
    // Toggle password visibility for both fields
    function setupToggle(buttonId, inputId) {
        const button = document.getElementById(buttonId);
        const input = document.getElementById(inputId);
        if (!button || !input) return;
        button.addEventListener("click", function () {
            input.type = input.type === "password" ? "text" : "password";
        });
    }

    setupToggle("toggleNewPassword", "newPassword");
    setupToggle("toggleConfirmPassword", "confirmNewPassword");
</script>

</body>
</html>
