<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepStart - Forgot Password</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="forgot-page">

    <div class="forgot-card">

        <img src="/images/prepstart-logo.png" class="login-logo" alt="PrepStart Logo">

        <h1>Forgot Password?</h1>

        <p class="forgot-description">
            Enter the email address associated with
            your account, and we'll send you a link
            to reset your password.
        </p>

        <!-- Error message (email not found) -->
        <p th:if="${error}"
           style="color: red; text-align: center; font-size: 10px; margin-bottom: 15px;"
           th:text="${error}"></p>

        <!-- Success message (email sent) -->
        <p th:if="${success}"
           style="color: green; text-align: center; font-size: 15px; margin-bottom: 15px;"
           th:text="${success}"></p>

        <form th:action="@{/forgot-password}" method="post">

            <div class="form-group">
                <label for="forgotEmail">Email Address</label>
                <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="Enter your email address"
                        required
                >
            </div>

            <button type="submit" class="login-button">
                Send Reset Link
            </button>

        </form>

        <p class="forgot-back">
            Remember your password?
            <a href="/login">Back to Log in</a>
        </p>

        <p class="forgot-create">
            Don't have an account?
            <a href="/register">Create an account</a>
        </p>

    </div>

</div>

</body>
</html>
