<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepStart - Verify Your Identity</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="verify-page">

    <div class="verify-card">

        <img src="/images/prepstart-logo.png" class="login-logo" alt="PrepStart Logo">

        <h1>VERIFY YOUR IDENTITY</h1>

        <p class="verify-instruction"> ENTER THE CODE SENT TO YOUR EMAIL. </p>

        <p class="verify-email">
            We sent a verification code to
            <strong th:text="${email != null ? email : 'your email'}">your email</strong>.
        </p>

        <!-- Error message shown if verification fails -->
        <p th:if="${error}"
           style="color: red; text-align: center; font-size: 12px; margin-bottom: 15px;"
           th:text="${error}"></p>

        <!-- THE FORM: wraps the inputs and the button -->
        <form th:action="@{/verify}" method="post" id="verifyForm">

            <!-- Hidden email so the backend knows which user to check -->
            <input type="hidden" name="email" th:value="${email}">

            <!-- Hidden combined code — filled by JavaScript on submit -->
            <input type="hidden" name="code" id="combinedCode">

            <div class="verification-inputs">

                <input type="text" class="code-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric">
                <input type="text" class="code-input" maxlength="1" inputmode="numeric">

            </div>

            <p class="code-expiry">
                Code expires in <span id="timer">10:00</span>
            </p>

            <button type="submit" class="verify-button" id="verifyButton">
                Verify
            </button>

        </form>

        <p class="resend-code">
            Didn't receive the code?
            <a href="#" id="resendCode">Resend Code</a>
        </p>

        <p class="back-login">
            <a href="/login">Back to Log in</a>
        </p>
    </div>
</div>

<script>

    const codeInputs = document.querySelectorAll(".code-input");
    const combinedCode = document.getElementById("combinedCode");
    const verifyForm = document.getElementById("verifyForm");

    // Auto-advance focus and allow backspace
    codeInputs.forEach((input, index) => {

        input.addEventListener("input", function () {
            this.value = this.value.replace(/[^0-9]/g, "");
            if (this.value && index < codeInputs.length - 1) {
                codeInputs[index + 1].focus();
            }
        });

        input.addEventListener("keydown", function (event) {
            if (event.key === "Backspace" && !this.value && index > 0) {
                codeInputs[index - 1].focus();
            }
        });
    });

    // Paste support (paste a 6-digit code all at once)
    codeInputs[0].addEventListener("paste", function (event) {
        event.preventDefault();
        const pastedCode = event.clipboardData.getData("text")
            .replace(/[^0-9]/g, "")
            .slice(0, 6);

        pastedCode.split("").forEach((number, index) => {
            if (codeInputs[index]) {
                codeInputs[index].value = number;
            }
        });

        const nextIndex = Math.min(pastedCode.length, codeInputs.length - 1);
        codeInputs[nextIndex].focus();
    });

    // Timer (counts down from 1 minute)
    let timeRemaining = 10 * 60;
    const timer = document.getElementById("timer");

    function updateTimer() {
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        timer.textContent = String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        if (timeRemaining > 0) timeRemaining--;
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    // When the form is submitted, combine the 6 digits into the hidden field
    verifyForm.addEventListener("submit", function (event) {

        let verificationCode = "";
        codeInputs.forEach(input => verificationCode += input.value);

        combinedCode.value = verificationCode;

        if (verificationCode.length !== 6) {
            event.preventDefault();
            alert("Please enter the 6-digit verification code.");
        }
    });

    // Resend (placeholder — we'll wire this up later)
    document.getElementById("resendCode").addEventListener("click", function (event) {
        event.preventDefault();
        alert("The resend email function will be connected later.");
    });

</script>

</body>
</html>
